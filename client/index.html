<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SUN_IN — Чат</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0000aa;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 16px;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            border: 2px solid #55ffff;
            padding: 12px;
            background-color: #0000aa;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #55ffff;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .header-title {
            color: #ffff55;
            font-size: 16px;
            font-weight: bold;
        }
        .btn {
            background-color: #0000aa;
            color: #ffff55;
            border: 1px solid #ffff55;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            padding: 4px 10px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #ffff55;
            color: #000000;
        }
        .btn:disabled {
            color: #888888;
            border-color: #888888;
            cursor: default;
            background-color: #0000aa;
        }
        table.layout {
            width: 100%;
            border-collapse: collapse;
        }
        td.col-users {
            width: 240px;
            vertical-align: top;
            padding-right: 10px;
        }
        td.col-chat {
            vertical-align: top;
        }
        .box-title {
            color: #ffff55;
            font-weight: bold;
            margin-bottom: 6px;
            border-bottom: 1px dashed #55ffff;
            padding-bottom: 2px;
        }
        .screen {
            background-color: #000055;
            border: 1px solid #55ffff;
            font-family: inherit;
            font-size: 13px;
            color: #ffffff;
            padding: 8px;
            overflow-y: auto;
            line-height: 1.4;
        }
        .user-item {
            padding: 4px 6px;
            cursor: pointer;
            border-bottom: 1px dotted #000088;
            display: flex;
            justify-content: space-between;
        }
        .user-item:hover {
            background-color: #55ffff;
            color: #000000;
        }
        .user-item.active {
            background-color: #ffff55;
            color: #000000;
            font-weight: bold;
        }
        input[type="text"] {
            background-color: #000088;
            color: #ffff55;
            border: 1px solid #55ffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            padding: 5px 8px;
            width: 100%;
            outline: none;
        }
        input[type="text"]:focus {
            background-color: #55ffff;
            color: #000000;
        }
        input[type="text"]:disabled {
            background-color: #000044;
            color: #666666;
            border-color: #444488;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Шапка -->
    <div class="header">
        <div>
            <span class="header-title">SUN_IN</span> | 
            Вы: <b id="headerUserBadge" style="color: #ffff55;">@user</b> | 
            <span id="statusText">Подключение...</span>
        </div>
        <div>
            <button type="button" class="btn" id="refreshUsersBtn" disabled>[ Обновить ]</button>
            <button type="button" class="btn" id="pingBtn" disabled>[ Пинг ]</button>
            <button type="button" class="btn" id="logoutBtn">[ Выйти ]</button>
        </div>
    </div>

    <!-- Основная сетка -->
    <table class="layout">
        <tr>
            <!-- Список пользователей -->
            <td class="col-users">
                <div class="box-title">ПОЛЬЗОВАТЕЛИ</div>
                <div id="dialogList" class="screen" style="height: 420px;">
                    <div style="color: #aaaaaa; padding: 4px;">Загрузка...</div>
                </div>
            </td>

            <!-- Чат -->
            <td class="col-chat">
                <div class="box-title" id="activeDialogTitle">ЧАТ: (выберите пользователя слева)</div>
                <div id="messages" class="screen" style="height: 380px; margin-bottom: 8px;">
                    <div style="color: #55ffff;">Подключение к серверу...</div>
                </div>

                <!-- Строка ввода -->
                <table style="width: 100%; border-collapse: collapse;">
                    <tr>
                        <td style="padding-right: 8px;">
                            <input type="text" id="msgInput" placeholder="Введите сообщение..." disabled autocomplete="off">
                        </td>
                        <td width="110">
                            <button type="button" class="btn" id="sendBtn" style="width: 100%; padding: 6px 0;" disabled>[ ОТПРАВИТЬ ]</button>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>

<script type="module">
    import { SunInClient } from './sun_in_pure.js';

    const rawAuth = localStorage.getItem('sun_in_auth');
    if (!rawAuth) {
        window.location.href = 'auth.html';
    }

    let authData = null;
    try {
        authData = JSON.parse(rawAuth);
    } catch (_) {
        localStorage.removeItem('sun_in_auth');
        window.location.href = 'auth.html';
    }

    if (!authData || !authData.nickname) {
        window.location.href = 'auth.html';
    }

    let client = null;
    let activeContact = null;
    let currentUser = null;

    const dialogHistories = {};

    const statusText = document.getElementById('statusText');
    const headerUserBadge = document.getElementById('headerUserBadge');
    const logoutBtn = document.getElementById('logoutBtn');
    const refreshUsersBtn = document.getElementById('refreshUsersBtn');
    const pingBtn = document.getElementById('pingBtn');
    const dialogListEl = document.getElementById('dialogList');
    const activeDialogTitle = document.getElementById('activeDialogTitle');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    headerUserBadge.textContent = `@${authData.nickname}`;

    function logoff() {
        if (client) {
            try { client.disconnect(); } catch (_) {}
        }
        localStorage.removeItem('sun_in_auth');
        window.location.href = 'auth.html';
    }

    logoutBtn.addEventListener('click', logoff);

    function appendLog(line, color = '#ffffff') {
        const div = document.createElement('div');
        div.style.color = color;
        div.textContent = line;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function renderMessagesForActiveContact() {
        messagesDiv.innerHTML = '';
        if (!activeContact) {
            appendLog('Выберите контакт слева, чтобы начать диалог.', '#55ffff');
            return;
        }

        const history = dialogHistories[activeContact] || [];
        if (history.length === 0) {
            appendLog(`Диалог с @${activeContact}. Сообщений пока нет.`, '#ffff55');
            return;
        }

        history.forEach(m => {
            const prefix = m.outgoing ? `[Вы -> @${m.to}]` : `[@${m.from}]`;
            const color = m.outgoing ? '#55ff55' : '#ffffff';
            appendLog(`${prefix}: ${m.text}`, color);
        });
    }

    function setConnected(connected) {
        if (connected) {
            statusText.innerHTML = '<span style="color:#55ff55; font-weight:bold;">В сети</span>';
            refreshUsersBtn.disabled = false;
            pingBtn.disabled = false;
            msgInput.disabled = !activeContact;
            sendBtn.disabled = !activeContact;
        } else {
            statusText.innerHTML = '<span style="color:#ff5555; font-weight:bold;">Отключен</span>';
            refreshUsersBtn.disabled = true;
            pingBtn.disabled = true;
            msgInput.disabled = true;
            sendBtn.disabled = true;
        }
    }

    function renderUserList(users) {
        dialogListEl.innerHTML = '';
        const contacts = users.filter(u => u !== (client?.nickname || authData.nickname));

        if (contacts.length === 0) {
            dialogListEl.innerHTML = '<div style="color: #aaaaaa; padding: 4px;">Никого нет в сети</div>';
            return;
        }

        contacts.forEach(user => {
            const div = document.createElement('div');
            div.className = `user-item ${user === activeContact ? 'active' : ''}`;
            div.innerHTML = `<span>@${user}</span><span style="color:#ffff55;">[онлайн]</span>`;
            div.onclick = () => {
                activeContact = user;
                activeDialogTitle.textContent = `ЧАТ: @${user}`;
                document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                msgInput.disabled = false;
                sendBtn.disabled = false;
                msgInput.focus();
                renderMessagesForActiveContact();
            };
            dialogListEl.appendChild(div);
        });
    }

    async function initConnection() {
        const serverUrl = authData.server_url || 'ws://127.0.0.1:8888';
        client = new SunInClient(serverUrl, authData.nickname);

        client.on('open', () => {
            appendLog(`Связь с сервером установлена. Вход как @${authData.nickname}...`, '#55ffff');
            client.authenticate(authData.nickname, authData.token || '');
        });

        client.on('AUTH_SUCCESS', (pkt) => {
            currentUser = pkt.auth_success;
            setConnected(true);
            headerUserBadge.textContent = `@${currentUser.nickname}`;
            appendLog(`Успешный вход: ${currentUser.message}.`, '#55ff55');
            client.requestUsers();
        });

        client.on('AUTH_FAIL', (pkt) => {
            const reason = pkt.auth_fail?.reason || 'Ошибка сессии';
            setConnected(false);
            alert(`Ошибка авторизации: ${reason}.`);
            logoff();
        });

        client.on('USER_LIST_RESP', (pkt) => {
            const users = pkt.user_list_resp?.users || [];
            renderUserList(users);
        });

        client.on('MSG_DIRECT', (pkt) => {
            const md = pkt.msg_direct;
            if (!md) return;

            const myNick = client.nickname || authData.nickname;
            const isMe = md.from_user === myNick;
            const otherParty = isMe ? md.to_user : md.from_user;

            if (!dialogHistories[otherParty]) {
                dialogHistories[otherParty] = [];
            }
            dialogHistories[otherParty].push({
                from: md.from_user,
                to: md.to_user,
                text: md.text,
                outgoing: isMe,
            });

            if (activeContact === otherParty) {
                const prefix = isMe ? `[Вы -> @${md.to_user}]` : `[@${md.from_user}]`;
                const color = isMe ? '#55ff55' : '#ffffff';
                appendLog(`${prefix}: ${md.text}`, color);
            }
        });

        client.on('PONG', (pkt) => {
            appendLog(`[Понг] Ответ от сервера получен (seq=${pkt.seq_id})`, '#ffff55');
        });

        client.on('close', () => {
            setConnected(false);
            appendLog('Соединение с сервером закрыто.', '#ff5555');
        });

        client.on('error', () => {
            setConnected(false);
            appendLog('Ошибка связи с сервером.', '#ff5555');
        });

        try {
            await client.connect();
        } catch (e) {
            setConnected(false);
            appendLog(`Не удалось подключиться к ${serverUrl}.`, '#ff5555');
        }
    }

    refreshUsersBtn.addEventListener('click', () => {
        if (client) {
            client.requestUsers();
            appendLog('Запрос списка пользователей...', '#aaaaaa');
        }
    });

    pingBtn.addEventListener('click', () => {
        if (client) {
            const seq = client.ping();
            appendLog(`Отправлен пинг на сервер (seq=${seq})...`, '#aaaaaa');
        }
    });

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text || !client || !activeContact) return;

        client.sendDirect(activeContact, text);
        msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    initConnection();
</script>

</body>
</html>
