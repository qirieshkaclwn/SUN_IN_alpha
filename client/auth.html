<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — SUN_IN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0000aa;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 20px;
        }
        .box {
            max-width: 600px;
            margin: 40px auto;
            border: 2px solid #55ffff;
            padding: 16px;
            background-color: #0000aa;
        }
        .title {
            color: #ffff55;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #55ffff;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }
        td {
            padding: 6px 4px;
            vertical-align: middle;
        }
        input[type="text"], input[type="password"] {
            background-color: #000088;
            color: #ffff55;
            border: 1px solid #55ffff;
            font-family: inherit;
            font-size: 14px;
            padding: 4px 8px;
            width: 100%;
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            background-color: #55ffff;
            color: #000000;
        }
        .btn {
            background-color: #0000aa;
            color: #ffff55;
            border: 1px solid #ffff55;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 16px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #ffff55;
            color: #000000;
        }
        .btn:disabled {
            color: #888888;
            border-color: #888888;
            cursor: default;
            background-color: #0000aa;
        }
        .status {
            background-color: #000066;
            border: 1px solid #55ffff;
            padding: 8px;
            min-height: 38px;
            margin-bottom: 16px;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="box">
    <div class="title">АВТОРИЗАЦИЯ SUN_IN</div>

    <form id="authForm" autocomplete="off">
        <table>
            <tr>
                <td colspan="2" style="padding-bottom: 10px;">
                    <label style="cursor: pointer; margin-right: 20px;">
                        <input type="radio" name="authMode" id="modeLogin" value="login" checked>
                        <b>Вход</b>
                    </label>
                    <label style="cursor: pointer;">
                        <input type="radio" name="authMode" id="modeRegister" value="register">
                        <b>Регистрация</b>
                    </label>
                </td>
            </tr>
            <tr>
                <td width="130">Никнейм:</td>
                <td>
                    <input type="text" id="nickname" placeholder="имя пользователя" required minlength="3" maxlength="32">
                </td>
            </tr>
            <tr>
                <td id="tokenLabel">Пароль / ключ:</td>
                <td>
                    <input type="password" id="token" placeholder="введите пароль или ключ">
                </td>
            </tr>
            <tr>
                <td>Сервер:</td>
                <td>
                    <input type="text" id="serverUrl" value="ws://127.0.0.1:8765">
                </td>
            </tr>
        </table>

        <div id="statusMessage" class="status">
            Введите никнейм и нажмите [Войти].
        </div>

        <div style="text-align: center;">
            <button type="submit" class="btn" id="submitBtn">[ ВОЙТИ ]</button>
        </div>
    </form>
</div>

<script type="module">
    import { SunInClient } from './sun_in_pure.js';

    let currentMode = 'login';
    let client = null;

    const modeLogin = document.getElementById('modeLogin');
    const modeRegister = document.getElementById('modeRegister');
    const authForm = document.getElementById('authForm');
    const nicknameInput = document.getElementById('nickname');
    const tokenInput = document.getElementById('token');
    const tokenLabel = document.getElementById('tokenLabel');
    const serverUrlInput = document.getElementById('serverUrl');
    const statusMessage = document.getElementById('statusMessage');
    const submitBtn = document.getElementById('submitBtn');

    function updateMode() {
        if (modeLogin.checked) {
            currentMode = 'login';
            tokenLabel.textContent = 'Пароль / ключ:';
            tokenInput.placeholder = 'введите пароль или ключ';
            submitBtn.textContent = '[ ВОЙТИ ]';
            statusMessage.textContent = 'Режим: вход. Введите данные.';
            loadSavedToken();
        } else {
            currentMode = 'register';
            tokenLabel.textContent = 'Пароль (опц.):';
            tokenInput.placeholder = 'пароль (или оставьте пустым)';
            submitBtn.textContent = '[ ЗАРЕГИСТРИРОВАТЬСЯ ]';
            statusMessage.textContent = 'Режим: регистрация. Заполните никнейм.';
            tokenInput.value = '';
        }
    }

    modeLogin.addEventListener('change', updateMode);
    modeRegister.addEventListener('change', updateMode);

    function loadSavedToken() {
        if (currentMode !== 'login') return;
        const nick = nicknameInput.value.trim().toLowerCase();
        if (!nick) return;
        const saved = localStorage.getItem('sun_in_token_' + nick);
        if (saved) tokenInput.value = saved;
    }

    nicknameInput.addEventListener('input', loadSavedToken);

    const lastNick = localStorage.getItem('sun_in_last_nick');
    if (lastNick) {
        nicknameInput.value = lastNick;
        loadSavedToken();
    }
    const savedServerUrl = localStorage.getItem('sun_in_server_url');
    if (savedServerUrl) {
        serverUrlInput.value = savedServerUrl;
    }

    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nick = nicknameInput.value.trim();
        const token = tokenInput.value.trim();
        const serverUrl = serverUrlInput.value.trim();

        if (!nick) {
            statusMessage.innerHTML = '<span style="color:#ff5555;">Укажите никнейм.</span>';
            return;
        }

        submitBtn.disabled = true;
        statusMessage.textContent = 'Подключение к серверу...';

        if (client) {
            try { client.disconnect(); } catch (_) {}
        }

        client = new SunInClient(serverUrl, nick);

        let timeoutId = setTimeout(() => {
            submitBtn.disabled = false;
            statusMessage.innerHTML = '<span style="color:#ff5555;">Не удалось подключиться к серверу.</span>';
            if (client) client.disconnect();
        }, 5000);

        client.on('open', () => {
            clearTimeout(timeoutId);
            statusMessage.textContent = 'Соединение установлено. Проверка...';
            client.authenticate(nick, token);
        });

        client.on('AUTH_SUCCESS', (pkt) => {
            submitBtn.disabled = false;
            const currentUser = pkt.auth_success;

            const tokenMatch = currentUser.message.match(/токен:\s*([^\s]+)/i);
            const finalToken = tokenMatch ? tokenMatch[1] : (token || currentUser.user_id);

            localStorage.setItem('sun_in_last_nick', nick);
            localStorage.setItem('sun_in_server_url', serverUrl);
            localStorage.setItem('sun_in_token_' + nick.toLowerCase(), finalToken);
            localStorage.setItem('sun_in_auth', JSON.stringify({
                nickname: currentUser.nickname,
                user_id: currentUser.user_id,
                token: finalToken,
                server_url: serverUrl,
                message: currentUser.message,
                logged_in: true
            }));

            if (currentMode === 'register' && tokenMatch) {
                statusMessage.innerHTML = `
                    <span style="color:#55ff55;">Регистрация успешна!</span><br>
                    Ваш ключ: <b style="color:#ffff55;">${finalToken}</b> (сохраните его)
                `;
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
            } else {
                statusMessage.innerHTML = '<span style="color:#55ff55;">Успешный вход. Переход...</span>';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            }
        });

        client.on('AUTH_FAIL', (pkt) => {
            submitBtn.disabled = false;
            const reason = pkt.auth_fail?.reason || 'Ошибка авторизации';
            statusMessage.innerHTML = `<span style="color:#ff5555;">Ошибка: ${reason}</span>`;
            client.disconnect();
        });
    });
</script>

</body>
</html>
